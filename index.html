<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drift-Away</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Drift <span>Notes</span></div>
            <div class="controls">
                <button id="clearnBtn">Clear Sky</button>
            </div>
        </header>
        <div class="input-area">
            <input type="text"
            id="notelnput"
            placeholder="Write......."
            maxlength="120"
            autocomplete="off"/>
            <button class="release-btn" id="releaaseBtn">Release</button>
        </div>
        <div class="sky" id="sky"></div>
        <footer>Let's forget about your thoughts for a while</footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
